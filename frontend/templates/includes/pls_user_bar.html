{% if user %}
<span class="pls-user">
  <span class="pls-user-email" title="{{ user.email }}">{{ user.email }}</span>
  {% if header_home_link %}
  <a href="/" class="pls-header-link">На главную</a>
  {% endif %}
  <button type="button" class="btn-header-logout" id="pls-logout-btn">Выйти</button>
</span>
{% endif %}
