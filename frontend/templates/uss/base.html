<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}УСС{% endblock %} — ПЛС</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="pls-header">
    <a href="/" class="pls-logo">ПЛС</a>
    <nav class="pls-nav">
      <a href="/uss/transport" {% if active == 'transport' %}class="active"{% endif %}>Транспорт</a>
      <a href="/uss/warehouse" {% if active == 'warehouse' %}class="active"{% endif %}>Склад</a>
      <a href="/uss/inventory" {% if active == 'inventory' %}class="active"{% endif %}>Запасы</a>
      <a href="/admin/reference">Справочники</a>
      <a href="/admin/sso">SSO заявки</a>
    </nav>
    {% if user %}
    <span class="pls-user">{{ user.email }}</span>
    {% endif %}
  </header>
  <main class="pls-main {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/uss_common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
