<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="pls-build" content="{{ pls_build }}">
  <title>{% block title %}УСС{% endblock %} — ПЛС</title>
  <link rel="stylesheet" href="/static/css/main.css?v={{ pls_build }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="pls-header">
    {% include 'includes/pls_brand_uss.html' %}
    {% include 'includes/uss_header_nav.html' %}
    {% if user %}
    {% include 'includes/pls_user_bar.html' %}
    {% endif %}
  </header>
  <main class="pls-main pls-main--wide {% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/js/pls_header.js?v={{ pls_build }}"></script>
  <script src="/static/js/uss_common.js?v={{ pls_build }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
