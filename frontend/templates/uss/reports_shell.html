{% extends "uss/base.html" %}

{% block main_class %}admin-ref{% endblock %}

{% block content %}
  <h1 class="page-title">Отчёты</h1>
  <p class="muted">Биллинг и аналитика по операционному учёту.</p>
  <div class="ref-layout">
    <nav class="ref-nav ref-nav--links" aria-label="Разделы отчётов">
      <a href="/uss/reports/billing" class="ref-nav-link{% if report_section == 'billing' %} active{% endif %}">Биллинг ОХ</a>
      <a href="/uss/reports/fot" class="ref-nav-link{% if report_section == 'fot' %} active{% endif %}">Эффективность ОХ</a>
      <a href="/uss/reports/contracts" class="ref-nav-link{% if report_section == 'contracts' %} active{% endif %}">Договоры и ДС</a>
    </nav>
    <section class="ref-panel">
      {% block report_content %}{% endblock %}
    </section>
  </div>
{% endblock %}
