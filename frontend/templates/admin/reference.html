<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Справочники — ПЛС</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
  <header class="pls-header">
    <a href="/" class="pls-logo">ПЛС</a>
    <nav class="pls-nav">
      <a href="/uss/transport">Транспорт</a>
      <a href="/uss/warehouse">Склад</a>
      <a href="/uss/inventory">Запасы</a>
      <a href="/admin/reference" class="active">Справочники</a>
      <a href="/admin/sso">SSO заявки</a>
    </nav>
    {% if user %}
    <span class="pls-user">{{ user.email }}</span>
    {% endif %}
  </header>
  <main class="pls-main admin-ref">
    <h1>Справочники</h1>
    <p class="muted">CRUD через <code>/api/reference/&lt;catalog&gt;</code></p>
    <p id="status" class="status">Загрузка…</p>
    <div class="ref-layout">
      <nav id="catalog-nav" class="ref-nav"></nav>
      <section id="catalog-panel" class="ref-panel"></section>
    </div>
  </main>
  <script src="/static/js/reference-ui.js"></script>
</body>
</html>
